services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sensitive-words-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sandile@password1"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot job that creates the "sensitivewords" database before the service starts.
  # (The mssql image does not create databases automatically like some others do.)
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "Sandile@password1" -C
      -Q "IF DB_ID('sensitivewords') IS NULL CREATE DATABASE sensitivewords;"
    restart: "no"

  sensitive-words-service:
    build: .
    container_name: sensitive-words-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:sqlserver://mssql:1433;databaseName=sensitivewords;encrypt=false;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: "Sandile@password1"
    depends_on:
      mssql-init:
        condition: service_completed_successfully
